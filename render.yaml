# =====================================================================
#  Zimmer bot — Render.com BEPUL deploy "blueprint"
#
#  Render bu faylni avtomatik o'qiydi va xizmatni shu sozlamalar bilan
#  yaratadi. Maxfiy qiymatlar (sync: false) Render panelida qo'lda
#  kiritiladi — ular GitHub'ga TUSHMAYDI.
#
#  To'liq qo'llanma: DEPLOY.md
# =====================================================================
services:
  - type: web
    name: zimmer-bot
    runtime: python
    plan: free                 # bepul tarif (karta talab qilinmaydi)
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    healthCheckPath: /ready    # Tayyorlik: baza javob berayaptimi (SELECT 1).
                               # `/health` (liveness) va `/metrics` ham bor.
    autoDeploy: true           # GitHub'ga push bo'lsa — o'zi qayta deploy qiladi
    envVars:
      # ——— MAJBURIY maxfiy qiymatlar (Render panelida kiritiladi) ———
      - key: BOT_TOKEN
        sync: false
      # ——— Adminlar ———
      # Avto_A1 dagi adminlar KOD ichida (config.py -> CORE_ADMINS) yozilgan
      # va HAR DOIM admin bo'lib qoladi — bu o'zgaruvchi o'chsa ham.
      # Bu yerdagi ID'lar ularga QO'SHILADI (almashtirmaydi).
      # Yangi admin qo'shishning eng oson yo'li — bot ichida: /admin_add <ID>
      - key: ADMINS
        value: "5105291033,483425630,5302078"

      # ——— Firebase (mijozlar/tovarlar doimiy saqlanishi uchun) ———
      # serviceAccount.json BUTUN matni (yoki base64). Panelda kiritiladi.
      - key: SERVICE_ACCOUNT_JSON
        sync: false

      # ——— To'lov rekvizitlari ———
      # DIQQAT: bular MAXFIY (sync: false) — Render panelida qo'lda
      # kiritiladi va GitHub'ga TUSHMAYDI. Ilgari haqiqiy karta raqami
      # `config.py` da standart qiymat bo'lib turardi.
      # Bo'sh qoldirilsa Mini App «Karta orqali» to'lovni ko'rsatmaydi.
      - key: PAY_CARD_NUMBER
        sync: false
      - key: PAY_CARD_HOLDER
        sync: false
      - key: PAY_ADMIN_USERNAME
        sync: false

      # ——— AI yordamchi (Groq) ———
      # KALIT MAXFIY (sync: false) — Render panelida qo'lda kiritiladi va
      # GitHub'ga TUSHMAYDI. Bo'sh qoldirilsa AI shunchaki O'CHIQ bo'ladi
      # (bot oldingidek ishlaydi, xato bermaydi).
      #
      # NEGA BU YERDA E'LON QILINADI, agar qiymati panelda bo'lsa ham:
      # bu fayl — Render uchun "blueprint". Xizmat shu fayldan yaratiladi
      # va faylda YO'Q o'zgaruvchi keyingi blueprint sinxronizatsiyasida
      # tushib qolishi mumkin. `sync: false` esa Render'ga «bu o'zgaruvchi
      # bor, qiymati panelda» deb aytadi — ya'ni qiymat SAQLANADI va
      # bu yerda hujjatlashtirilgan ham bo'ladi.
      - key: GROQ_API_KEY
        sync: false
      # Modellar. Groq modellarni vaqti-vaqti bilan O'CHIRADI, shuning
      # uchun ular env orqali beriladi: model o'chsa kodni emas, shu
      # qiymatni almashtirish kifoya. Holatni botda `/ai` ko'rsatadi.
      - key: GROQ_TEXT_MODEL
        value: "openai/gpt-oss-120b"
      - key: GROQ_VISION_MODEL
        value: "qwen/qwen3.6-27b"
      # «Xo'jayin» — AI shu ID'ga «xo'jayin» deb murojaat qiladi,
      # qolgan adminlarga «admin». Bo'sh qoldirilsa CORE_ADMINS dagi
      # BIRINCHI ID xo'jayin bo'ladi. O'z ID'ingizni botda `/id` yoki
      # `/ai` ko'rsatadi.
      - key: OWNER_ID
        sync: false

      # ——— Aloqa (Mini App'dagi «Aloqa» bo'limi) ———
      - key: SHOP_PHONE
        sync: false
      - key: SHOP_TELEGRAM
        sync: false

      # ——— Mini App qaysi manzildan murojaat qilishi mumkin (CORS) ———
      # Bo'sh qoldirilsa MINI_APP_URL manzilidan o'zi aniqlanadi.
      # Bir nechta manzil vergul bilan. `*` — hammaga (TAVSIYA ETILMAYDI).
      - key: ALLOWED_ORIGINS
        sync: false

      - key: FIREBASE_DB_URL
        value: "https://zimmer-42840-default-rtdb.firebaseio.com"
      - key: FIREBASE_ROOT
        value: "zimmer"
      # Firebase Storage (mahsulot rasmlari uchun)
      - key: FIREBASE_STORAGE_BUCKET
        value: "zimmer-42840.appspot.com"

      # ——— Sozlamalar (panelda o'zgartirish mumkin) ———
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: SHOP_NAME
        value: "Zimmer"
      # Mini App manzili (GitHub Pages)
      - key: MINI_APP_URL
        value: "https://anvarjonaxtamov70.github.io/Zimmer/"
      - key: TIMEZONE
        value: "Asia/Tashkent"
      - key: WORK_START_HOUR
        value: "9"
      - key: WORK_END_HOUR
        value: "18"
      - key: SLOT_MINUTES
        value: "30"
      - key: BOOKING_DAYS_AHEAD
        value: "7"
      - key: CURRENCY
        value: "so'm"

      # DIQQAT: bepul tarifda disk saqlanmaydi — har qayta deployda
      # SQLite fayli tozalanadi. Doimiy saqlash uchun DEPLOY.md dagi
      # "Ma'lumotlar saqlanishi" bo'limini o'qing.
      - key: DB_PATH
        value: "zimmer.db"
